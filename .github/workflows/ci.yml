name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group dev
      - name: ruff check
        run: ruff check --output-format=github
      - name: ruff format
        run: ruff format --check
      - name: mypy
        run: mypy
      - name: import-linter
        run: lint-imports
      - name: codespell
        run: codespell
      - name: REUSE
        run: reuse lint
      - name: pytest
        run: pytest --cov --cov-report=term-missing
      - name: Coverage of the domain packages
        run: >-
          coverage report --fail-under=90
          --include='src/etude/core/*,src/etude/learning/*,src/etude/exercises/*'

  flatpak:
    name: Flatpak build and tests
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: etude.flatpak
          manifest-path: fi.oikarinenotto.etude.json
          cache-key: flatpak-builder-${{ github.sha }}
          run-tests: true
          upload-artifact: true
